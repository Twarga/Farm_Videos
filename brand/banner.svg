<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440">
  <defs>
    <filter id="wob" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- cream paper -->
  <rect width="2560" height="1440" fill="#f4edde"/>
  <g filter="url(#wob)">
    <!-- whiteboard -->
    <rect x="500" y="560" width="1560" height="430" rx="26" fill="#f8f2e6" stroke="#26211c" stroke-width="12"/>
    <text x="1268" y="740" font-family="'Patrick Hand',sans-serif" font-size="150" fill="#26211c" text-anchor="end">flat</text>
    <text x="1308" y="740" font-family="'Patrick Hand',sans-serif" font-size="150" fill="#e4573d" text-anchor="start">money</text>
    <!-- highlighter underline under 'money' -->
    <path d="M 1320 762 Q 1490 750 1665 772" stroke="#f2c14e" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.85"/>
    <!-- subtitle inside board -->
    <text x="1280" y="880" font-family="'Patrick Hand',sans-serif" font-size="60" fill="#6b5c48" text-anchor="middle">how money actually works · ~45s</text>

    <!-- robot perched on board top edge, left -->
    <g>
      <!-- ears -->
      <circle cx="636" cy="432" r="15" fill="#5f80d0" stroke="#2b2620" stroke-width="10"/>
      <circle cx="842" cy="432" r="15" fill="#5f80d0" stroke="#2b2620" stroke-width="10"/>
      <!-- legs peeking over the edge -->
      <rect x="664" y="540" width="30" height="46" rx="13" fill="#5f80d0" stroke="#2b2620" stroke-width="9"/>
      <rect x="714" y="542" width="30" height="46" rx="13" fill="#5f80d0" stroke="#2b2620" stroke-width="9"/>
      <rect x="764" y="542" width="30" height="46" rx="13" fill="#5f80d0" stroke="#2b2620" stroke-width="9"/>
      <rect x="814" y="540" width="30" height="46" rx="13" fill="#5f80d0" stroke="#2b2620" stroke-width="9"/>
      <!-- body -->
      <rect x="630" y="360" width="220" height="196" rx="30" fill="#5f80d0" stroke="#2b2620" stroke-width="11"/>
      <!-- speck -->
      <circle cx="668" cy="392" r="5" fill="#f2c14e"/>
      <!-- eyes -->
      <circle cx="748" cy="436" r="15" fill="#7ecb6f" stroke="#2b2620" stroke-width="7"/>
      <circle cx="798" cy="436" r="15" fill="#7ecb6f" stroke="#2b2620" stroke-width="7"/>
      <circle cx="753" cy="431" r="4" fill="#f3ead9"/>
      <circle cx="803" cy="431" r="4" fill="#f3ead9"/>
      <!-- mouth -->
      <line x1="738" y1="490" x2="816" y2="490" stroke="#2b2620" stroke-width="7" stroke-linecap="round"/>
      <line x1="738" y1="506" x2="816" y2="506" stroke="#2b2620" stroke-width="7" stroke-linecap="round"/>
      <line x1="738" y1="522" x2="778" y2="522" stroke="#2b2620" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- coin resting on the board edge near robot -->
    <circle cx="940" cy="400" r="70" fill="#f2c14e" stroke="#2b2620" stroke-width="11"/>
    <circle cx="940" cy="400" r="46" fill="none" stroke="#2b2620" stroke-width="6"/>
    <text x="940" y="424" font-family="'Patrick Hand',sans-serif" font-size="64" fill="#2b2620" text-anchor="middle">$</text>


    <!-- scattered bills -->
    <g transform="rotate(-14 320 250)">
      <rect x="240" y="218" width="170" height="68" rx="10" fill="#7ecb6f" stroke="#2b2620" stroke-width="9"/>
      <text x="325" y="270" font-family="'Patrick Hand',sans-serif" font-size="54" fill="#2b2620" text-anchor="middle">$</text>
    </g>
    <g transform="rotate(12 2260 1180)">
      <rect x="2175" y="1146" width="170" height="68" rx="10" fill="#7ecb6f" stroke="#2b2620" stroke-width="9"/>
      <text x="2260" y="1198" font-family="'Patrick Hand',sans-serif" font-size="54" fill="#2b2620" text-anchor="middle">$</text>
    </g>
    <g transform="rotate(8 210 1250)">
      <rect x="125" y="1216" width="170" height="68" rx="10" fill="#7ecb6f" stroke="#2b2620" stroke-width="9"/>
      <text x="210" y="1268" font-family="'Patrick Hand',sans-serif" font-size="54" fill="#2b2620" text-anchor="middle">$</text>
    </g>
  </g>
</svg>
