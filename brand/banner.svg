<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440">
  <!-- cream paper -->
  <rect width="2560" height="1440" fill="#f3ead9"/>

  <!-- whiteboard -->
  <rect x="507" y="488" width="1546" height="423" rx="26" fill="#fbf7ee" stroke="#26211c" stroke-width="11"/>

  <!-- robot on the board's top edge, holding a coin -->
  <g>
    <!-- arm to coin -->
    <rect x="1940" y="320" width="58" height="30" rx="15" fill="#5b7fd4" stroke="#26211c" stroke-width="9" transform="rotate(-18 1969 335)"/>
    <!-- ears -->
    <rect x="1788" y="330" width="22" height="34" rx="9" fill="#5b7fd4" stroke="#26211c" stroke-width="9"/>
    <rect x="1966" y="330" width="22" height="34" rx="9" fill="#5b7fd4" stroke="#26211c" stroke-width="9"/>
    <!-- legs (cut off by board edge, peeking over) -->
    <rect x="1824" y="474" width="26" height="42" rx="11" fill="#5b7fd4" stroke="#26211c" stroke-width="9"/>
    <rect x="1892" y="474" width="26" height="42" rx="11" fill="#5b7fd4" stroke="#26211c" stroke-width="9"/>
    <!-- body -->
    <rect x="1776" y="282" width="188" height="198" rx="30" fill="#5b7fd4" stroke="#26211c" stroke-width="11"/>
    <!-- eyes -->
    <circle cx="1834" cy="352" r="13" fill="#7ecb6f" stroke="#26211c" stroke-width="7"/>
    <circle cx="1906" cy="352" r="13" fill="#7ecb6f" stroke="#26211c" stroke-width="7"/>
    <!-- mouth -->
    <line x1="1822" y1="412" x2="1918" y2="412" stroke="#26211c" stroke-width="6" stroke-linecap="round"/>
    <line x1="1822" y1="428" x2="1918" y2="428" stroke="#26211c" stroke-width="6" stroke-linecap="round"/>
    <!-- coin -->
    <circle cx="2094" cy="288" r="62" fill="#f2c14e" stroke="#26211c" stroke-width="10"/>
    <circle cx="2094" cy="288" r="42" fill="none" stroke="#26211c" stroke-width="6"/>
    <text x="2094" y="310" font-family="'Patrick Hand',sans-serif" font-size="60" font-weight="700" fill="#26211c" text-anchor="middle">$</text>
  </g>

  <!-- title -->
  <rect x="985" y="578" width="420" height="96" rx="48" fill="#e4573d"/>
  <text x="1195" y="652" font-family="'Patrick Hand',sans-serif" font-size="96" fill="#f3ead9" text-anchor="middle">flat money</text>
  <text x="1195" y="762" font-family="'Patrick Hand',sans-serif" font-size="52" fill="#6b5c48" text-anchor="middle">how money actually works · ~45s</text>

  <!-- scattered bills, outside the safe zone -->
  <g>
    <g transform="rotate(-14 320 250)">
      <rect x="240" y="218" width="160" height="64" rx="10" fill="#7ecb6f" stroke="#26211c" stroke-width="8"/>
      <text x="320" y="268" font-family="'Patrick Hand',sans-serif" font-size="52" fill="#26211c" text-anchor="middle">$</text>
    </g>
    <g transform="rotate(12 2260 1180)">
      <rect x="2180" y="1148" width="160" height="64" rx="10" fill="#7ecb6f" stroke="#26211c" stroke-width="8"/>
      <text x="2260" y="1198" font-family="'Patrick Hand',sans-serif" font-size="52" fill="#26211c" text-anchor="middle">$</text>
    </g>
    <g transform="rotate(8 210 1250)">
      <rect x="130" y="1218" width="160" height="64" rx="10" fill="#7ecb6f" stroke="#26211c" stroke-width="8"/>
      <text x="210" y="1268" font-family="'Patrick Hand',sans-serif" font-size="52" fill="#26211c" text-anchor="middle">$</text>
    </g>
  </g>
</svg>
