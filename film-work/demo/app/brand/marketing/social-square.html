<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Social — square 1080</title><link rel="stylesheet" href="marketing.css">
<style>
  .frame { width: 1080px; height: 1080px; padding: 80px; background: var(--volt-400); display: flex; flex-direction: column; }
  .kick { font: 700 26px/1 var(--font-sans); font-stretch: 112%; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin-top: 48px; font-size: 150px; }
  h1 s { text-decoration-color: var(--verm-500); text-decoration-thickness: 12px; }
  .real { margin-top: 36px; display: inline-flex; flex-direction: column; align-self: flex-start; padding: 30px 36px; }
  .real small { font: 700 22px/1 var(--font-sans); font-stretch: 112%; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-600); }
  .real b { margin-top: 16px; font: 800 120px/.85 var(--font-sans); font-stretch: 125%; letter-spacing: -.06em; }
  .real span { margin-top: 16px; font: 500 26px/1.3 var(--font-sans); color: var(--ink-600); }
  .rack i.pick { background: #fff; }
  .rack--sm { gap: 12px; } .rack--sm i { height: 44px; border-radius: 12px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
  .foot img { height: 50px; }
  .foot span { font: 600 24px/1 var(--font-mono); }
</style></head>
<body><div class="frame">
  <span class="kick">The fine print, read</span>
  <h1 class="wide">The ad says <s>$4.</s></h1>
  <div class="sticker real"><small>The 3-year real price</small><b>$10.42/mo</b><span>IONOS VPS M+ · $4 for 3 months, then $11 on a 1-year contract</span></div>
  <div class="rack rack--sm" style="margin-top:56px;width:380px"><i></i><i class="pick"></i><i></i></div>
  <div class="foot"><img src="../logo/lockup-horizontal-on-volt.svg" alt=""><span>bestvpsforme.com</span></div>
</div></body></html>
