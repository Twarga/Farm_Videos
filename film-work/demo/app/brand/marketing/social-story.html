<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Social — story 1080×1920</title><link rel="stylesheet" href="marketing.css">
<style>
  .frame { width: 1080px; height: 1920px; padding: 120px 90px; background: var(--ink-950); color: #fff; display: flex; flex-direction: column; }
  .logo { height: 56px; align-self: flex-start; }
  h1 { margin-top: 140px; font-size: 168px; color: #fff; }
  h1 .hl { color: var(--ink-950); }
  p { margin-top: 56px; font: 500 42px/1.35 var(--font-sans); color: #a9b0bb; max-width: 20ch; }
  .rack { margin-top: 110px; width: 640px; }
  .rack i { background: #fff; }
  .rack i::before, .rack i::after { background: var(--ink-950); }
  .rack i.pick { background: var(--volt-400); box-shadow: none; }
  .cta { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
  .cta b { display: inline-flex; align-items: center; height: 110px; padding: 0 56px; border-radius: 999px; background: var(--volt-400); color: var(--ink-950); font: 700 40px/1 var(--font-sans); font-stretch: 112%; }
  .cta span { font: 600 30px/1 var(--font-mono); color: #7f8792; }
</style></head>
<body><div class="frame">
  <img class="logo" src="../logo/lockup-horizontal-dark.svg" alt="">
  <h1 class="wide">Pick the <span class="hl">server.</span> Skip the catch.</h1>
  <p>314 VPS plans. One honest number each.</p>
  <div class="rack"><i></i><i class="pick"></i><i></i><i></i></div>
  <div class="cta"><b>Compare plans →</b><span>bestvpsforme.com</span></div>
</div></body></html>
